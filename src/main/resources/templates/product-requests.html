<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WDC-HUB — 상품정보수정 요청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/dashboard.css}">
<style>
  .pr-search-input{ width:100%; background:var(--bg-raise); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-size:13.5px; padding:11px 14px; box-sizing:border-box; }
  .pr-search-input:focus{ outline:none; border-color:var(--gold); }
  .pr-hint{ font-size:12px; color:var(--text-faint); margin:8px 2px 0; }
  .pr-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .pr-table th{ text-align:left; padding:9px 12px; color:var(--text-faint); font-weight:600; font-size:12px;
    border-bottom:1px solid var(--line-soft); white-space:nowrap; }
  .pr-table td{ padding:10px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  .pr-table .mono{ font-family:var(--mono); font-size:12px; color:var(--text-dim); white-space:nowrap; }
  .pr-empty{ text-align:center; color:var(--text-faint); padding:28px 12px; font-size:13px; }
  .pr-wrap{ white-space:pre-wrap; word-break:break-word; line-height:1.55; }
  .pr-note{ margin-top:6px; padding:8px 10px; border-radius:6px; background:rgba(212,166,42,.08);
    border:1px solid var(--gold-dim); font-size:12.5px; }
  .pr-note b{ color:var(--gold); margin-right:6px; }
  .pr-pill{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap;
    background:var(--surface-2); color:var(--text-dim); }
  .pr-pill.RECEIVED{ background:rgba(91,140,255,.12); color:var(--blue); }
  .pr-pill.IN_PROGRESS{ background:rgba(224,166,60,.14); color:var(--amber); }
  .pr-pill.DONE{ background:rgba(52,201,126,.12); color:var(--green); }
  .pr-pill.REJECTED{ background:rgba(240,97,91,.12); color:var(--red); }
  .pr-req-btn{ font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:6px; cursor:pointer;
    border:1px solid var(--gold-dim); background:rgba(212,166,42,.1); color:var(--gold); white-space:nowrap; }
  .pr-req-btn:hover{ background:var(--gold); color:#1A1400; }
  .pr-panel-gap{ margin-top:18px; }
</style>
</head>
<body th:attr="data-products-api=@{/products/list}, data-my-requests-api=@{/product-requests/mine}">

<div class="ticker">
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<div class="shell">
  <aside th:replace="~{fragments/sidebar :: sidebar(active='product-modify-request')}"></aside>

  <!-- MAIN -->
  <div class="main">
    <div th:replace="~{fragments/topbar :: topbar(
          searchPlaceholder='상품명, 제조사, 공급사로 검색',
          showKbdHint=false,
          showCategoryBtn=false,
          avatarText=${#strings.isEmpty(companyName) ? '회' : #strings.substring(companyName, 0, 1)},
          companyName=${companyName},
          showExport=false,
          showCalcBtn=false,
          showBell=false,
          searchNavUrl=@{/products})}"></div>

    <div class="content">
      <div class="page-head">
        <div class="page-title">상품정보수정 요청<span>정보가 잘못됐거나 바뀐 상품을 찾아 수정을 요청해 주세요</span></div>
      </div>

      <!-- 상품 찾기 -->
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">수정할 상품 찾기</div>
        </div>
        <div class="panel-body">
          <input type="text" id="prSearch" class="pr-search-input" placeholder="상품명, 바코드, 품번으로 검색해 보세요" autocomplete="off">
          <div class="pr-hint" id="prSearchHint">상품을 불러오는 중이에요...</div>
          <div style="overflow-x:auto; margin-top:10px;">
            <table class="pr-table" id="prResultTable" style="display:none;">
              <thead>
                <tr><th>상품명</th><th>바코드</th><th>품번</th><th style="width:110px"></th></tr>
              </thead>
              <tbody id="prResultBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 내 요청 내역 -->
      <div class="panel pr-panel-gap">
        <div class="panel-head">
          <div class="panel-title">내 요청 내역<span class="n" id="prMyCount">0건</span></div>
        </div>
        <div style="overflow-x:auto;">
          <table class="pr-table">
            <thead>
              <tr>
                <th style="width:120px">요청일</th>
                <th>상품</th>
                <th style="width:90px">항목</th>
                <th>요청 내용</th>
                <th style="width:80px">상태</th>
              </tr>
            </thead>
            <tbody id="prMyBody">
              <tr><td colspan="5" class="pr-empty">불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- footer -->
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
  </div>
</div>

<script th:src="@{/js/ticker.js}"></script>
<script>
(function () {
  'use strict';

  var PRODUCTS_API = document.body.dataset.productsApi;
  var MY_API = document.body.dataset.myRequestsApi;
  var MAX_RESULTS = 30;

  var products = [];
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

  function fmtDate(v) {
    if (!v) return '';
    if (Array.isArray(v)) {
      return v[0] + '-' + String(v[1]).padStart(2, '0') + '-' + String(v[2]).padStart(2, '0');
    }
    return String(v).slice(0, 10);
  }

  // ── 상품 검색 ────────────────────────────
  async function loadProducts() {
    try {
      var res = await fetch(PRODUCTS_API);
      if (!res.ok) throw new Error('fail');
      products = await res.json();
      $('prSearchHint').textContent = '전체 ' + products.length.toLocaleString('ko-KR') + '개 상품 중에서 검색해요.';
    } catch (e) {
      $('prSearchHint').textContent = '상품 목록을 불러오지 못했어요. 새로고침해 주세요.';
    }
  }

  function renderResults() {
    var q = $('prSearch').value.trim().toLowerCase();
    var table = $('prResultTable');
    var body = $('prResultBody');
    body.innerHTML = '';

    if (!q) { table.style.display = 'none'; return; }

    var matched = products.filter(function (p) {
      return (p.productName || '').toLowerCase().indexOf(q) !== -1
          || (p.barcode || '').toLowerCase().indexOf(q) !== -1
          || (p.productNumber || '').toLowerCase().indexOf(q) !== -1;
    });

    if (!matched.length) {
      table.style.display = 'none';
      $('prSearchHint').textContent = '검색 결과가 없어요. 다른 검색어로 찾아 보세요.';
      return;
    }

    $('prSearchHint').textContent = matched.length > MAX_RESULTS
      ? '검색 결과 ' + matched.length.toLocaleString('ko-KR') + '건 중 앞의 ' + MAX_RESULTS + '건만 보여요. 검색어를 더 자세히 입력해 주세요.'
      : '검색 결과 ' + matched.length + '건';

    table.style.display = '';
    matched.slice(0, MAX_RESULTS).forEach(function (p) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="pr-wrap">' + esc(p.productName) + '</td>' +
        '<td class="mono">' + esc(p.barcode || '-') + '</td>' +
        '<td class="mono">' + esc(p.productNumber || '-') + '</td>' +
        '<td><button type="button" class="pr-req-btn" data-pd-request' +
          ' data-product-id="' + esc(p.id) + '"' +
          ' data-product-name="' + encodeURIComponent(p.productName || '') + '"' +
          ' data-product-barcode="' + encodeURIComponent(p.barcode || '') + '">수정 요청</button></td>';
      body.appendChild(tr);
    });
  }

  var timer = null;
  $('prSearch').addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(renderResults, 150);
  });

  // ── 내 요청 내역 ─────────────────────────
  async function loadMine() {
    var body = $('prMyBody');
    try {
      var res = await fetch(MY_API, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) throw new Error('fail');
      var list = await res.json();
      $('prMyCount').textContent = list.length + '건';

      if (!list.length) {
        body.innerHTML = '<tr><td colspan="5" class="pr-empty">아직 보낸 요청이 없어요.</td></tr>';
        return;
      }
      body.innerHTML = '';
      list.forEach(function (r) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="mono">' + esc(fmtDate(r.createdAt)) + '</td>' +
          '<td class="pr-wrap">' + esc(r.productName) +
            (r.productBarcode ? '<div class="mono" style="margin-top:2px;">' + esc(r.productBarcode) + '</div>' : '') + '</td>' +
          '<td>' + esc(r.fieldLabel) + '</td>' +
          '<td><div class="pr-wrap">' + esc(r.content) + '</div>' +
            (r.adminNote ? '<div class="pr-note pr-wrap"><b>관리자 답변</b>' + esc(r.adminNote) + '</div>' : '') + '</td>' +
          '<td><span class="pr-pill ' + esc(r.status) + '">' + esc(r.statusLabel) + '</span></td>';
        body.appendChild(tr);
      });
    } catch (e) {
      body.innerHTML = '<tr><td colspan="5" class="pr-empty">요청 내역을 불러오지 못했어요. 새로고침해 주세요.</td></tr>';
    }
  }

  // 수정 요청이 접수되면(공용 팝업이 알려줌) 내역을 새로고침
  document.addEventListener('product-request:created', loadMine);

  loadProducts();
  loadMine();
})();
</script>
</body>
</html>
