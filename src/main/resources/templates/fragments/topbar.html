<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  공용 상단바 프래그먼트입니다.
  페이지마다 검색창 문구, 아바타 글자, 보여줄 버튼이 달라서 파라미터로 받습니다.
  searchNavUrl: 검색창에서 Enter를 눌렀을 때 이동할 주소 (예: @{/products}). 필요 없는 페이지는 null로 넘기세요.

  사용 예 (대시보드):
  <div th:replace="~{fragments/topbar :: topbar(
        searchPlaceholder='상품명, 제조사, 공급사로 검색',
        showKbdHint=true,
        showCategoryBtn=true,
        avatarText='셀',
        companyName=${companyName},
        showExport=true,
        showCalcBtn=true,
        showBell=true,
        searchNavUrl=@{/products})}"></div>

  사용 예 (회원관리, 버튼 없이 검색창+아바타만, 검색 이동 없음):
  <div th:replace="~{fragments/topbar :: topbar(
        searchPlaceholder='아이디, 회사명, 이메일로 검색',
        showKbdHint=false,
        showCategoryBtn=false,
        avatarText='관',
        companyName=${companyName},
        showExport=false,
        showCalcBtn=false,
        showBell=false,
        searchNavUrl=null)}"></div>
-->
<div class="topbar" th:fragment="topbar(searchPlaceholder, showKbdHint, showCategoryBtn, avatarText, companyName, showExport, showCalcBtn, showBell, searchNavUrl)"
     th:with="kakaoChannelId=${@environment.getProperty('app.kakao.channel-public-id', '_xkkKxoxj')}">
  <div class="search" th:attr="data-search-nav=${searchNavUrl}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="text" id="topbarSearchInput" th:placeholder="${searchPlaceholder}">
    <kbd th:if="${showKbdHint}">⌘K</kbd>
    <div class="search-suggest" id="searchSuggest" style="display:none;"></div>
  </div>
  <div th:if="${showCategoryBtn}" class="category-menu-wrap" th:attr="data-menu-api=@{/categories/menu}">
    <button type="button" class="btn category-all-btn" id="categoryAllBtn" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      카테고리 전체보기
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="cat-mega" id="categoryMegaPanel"></div>
  </div>
  <div class="topbar-right">
    <button th:if="${showExport}" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9"/><path d="M2 15h20l-2 5H4l-2-5z"/></svg>엑셀로 내보내기
    </button>
    <button th:if="${showCalcBtn}" class="btn gold">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h2M12 10h2M16 10h2"/></svg>판매가 계산기
    </button>
    <!-- 화면 모드 전환: 다크 ↔ 라이트. 선택은 브라우저에 저장되어 모든 화면에 적용됩니다. -->
    <div class="icon-btn theme-toggle" id="themeToggle" role="button" tabindex="0" aria-pressed="false"
         title="라이트 모드로 전환" aria-label="라이트 모드로 전환">
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </div>
    <script>
      (function () {
        var KEY = 'wdcTheme';
        var btn = document.getElementById('themeToggle');
        if (!btn) return;

        function current() { return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
        function paint(theme) {
          if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
          else document.documentElement.removeAttribute('data-theme');
          var light = theme === 'light';
          var label = light ? '다크 모드로 전환' : '라이트 모드로 전환';
          btn.setAttribute('aria-pressed', String(light));
          btn.setAttribute('title', label);
          btn.setAttribute('aria-label', label);
        }
        function toggle() {
          var next = current() === 'light' ? 'dark' : 'light';
          paint(next);
          try { localStorage.setItem(KEY, next); } catch (e) { /* 저장이 막혀 있어도 이번 화면에서는 바뀝니다 */ }
        }

        btn.addEventListener('click', toggle);
        btn.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });
        // 다른 탭에서 모드를 바꾸면 이 탭도 같이 바뀝니다.
        window.addEventListener('storage', function (e) {
          if (e.key === KEY) paint(e.newValue === 'light' ? 'light' : 'dark');
        });
        paint(current());
      })();
    </script>
    <!-- 카카오톡 채널: 카카오톡 앱에서 채널로 문의(채팅)하거나 채널을 친구로 추가합니다. (사이트 안 채팅과는 별개)
         채널 공개 ID(pf.kakao.com/ 뒤의 _로 시작하는 값)는 application.properties의 app.kakao.channel-public-id로 바꿀 수 있습니다. -->
    <style>
      .icon-btn.kakao-btn{ color:#FEE500; text-decoration:none; }
      .icon-btn.kakao-btn:hover{ color:#FFF27A; }
    </style>
    <a class="icon-btn kakao-btn" th:href="${'https://pf.kakao.com/' + kakaoChannelId + '/chat'}"
       data-popup-name="kakaoChannelChat" data-popup-w="480" data-popup-h="760"
       target="_blank" rel="noopener noreferrer" title="카카오톡으로 문의하기" aria-label="카카오톡 채널 채팅하기 (새 창)">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 3C6.48 3 2 6.58 2 11c0 2.8 1.86 5.26 4.66 6.68L5.6 21.4l4.35-2.32c.68.1 1.34.16 2.05.16 5.52 0 10-3.58 10-8s-4.48-8-10-8z"/></svg>
    </a>
    <a class="icon-btn kakao-btn" th:href="${'https://pf.kakao.com/' + kakaoChannelId + '/friend'}"
       data-popup-name="kakaoChannelAdd" data-popup-w="480" data-popup-h="680"
       target="_blank" rel="noopener noreferrer" title="카카오톡 채널 추가" aria-label="카카오톡 채널 친구 추가하기 (새 창)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
    </a>
    <!-- 카카오 아이콘을 누르면 새 탭이 아니라 작은 새 창(팝업)으로 엽니다.
         PC에서는 화면 가운데에 별도 창이 뜨고, 스크립트가 막혔거나 모바일이면 원래의 링크(target=_blank)로 열립니다. -->
    <script>
      (function () {
        document.querySelectorAll('a.kakao-btn[data-popup-name]').forEach(function (a) {
          a.addEventListener('click', function (e) {
            // Ctrl/Cmd/Shift 클릭이나 마우스 가운데 버튼은 브라우저 기본 동작(탭 열기)을 그대로 씁니다.
            if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
            var w = parseInt(a.getAttribute('data-popup-w'), 10) || 480;
            var h = parseInt(a.getAttribute('data-popup-h'), 10) || 720;
            var left = Math.max(0, Math.round((window.screen.availWidth - w) / 2));
            var top = Math.max(0, Math.round((window.screen.availHeight - h) / 2));
            var features = 'popup=yes,width=' + w + ',height=' + h + ',left=' + left + ',top=' + top +
                           ',resizable=yes,scrollbars=yes';
            var win = window.open(a.href, a.getAttribute('data-popup-name'), features);
            if (win) {
              e.preventDefault();      // 팝업이 열렸으면 링크의 기본 동작(새 탭)은 막습니다.
              try { win.opener = null; } catch (err) { /* 무시 */ }
              win.focus();
            }
            // win이 null이면(팝업 차단 등) 링크의 기본 동작으로 새 탭이 열립니다.
          });
        });
      })();
    </script>
    <!-- 채팅: 회원은 관리자와, 관리자는 회원과 1:1 대화합니다. 벨 아이콘 바로 옆에 있습니다. -->
    <div class="icon-btn chat-btn" id="chatBtn" role="button" tabindex="0" aria-label="채팅" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="notif-badge" id="chatBadge" style="display:none;"></span>
    </div>
    <!-- 알림 벨: 모든 페이지에 표시됩니다. 안 읽은 알림 개수는 notification-bell.js가 숫자로 채웁니다.
         (showBell 값은 더 이상 쓰지 않지만, 기존 페이지들이 넘기고 있어서 파라미터는 그대로 둡니다.) -->
    <div class="icon-btn notif-bell" id="notifBell" role="button" tabindex="0" aria-label="알림" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="notif-badge" id="notifBadge" style="display:none;"></span>
    </div>

    <!-- 회사명 + 아바타. 마우스를 올리면 회원정보/로그아웃 드롭다운이 나옵니다. -->
    <div class="user-menu">
      <div class="user-trigger">
        <span class="user-company" th:text="${companyName}">회사명</span>
        <div class="avatar" th:text="${avatarText}">셀</div>
      </div>
      <div class="user-dropdown">
        <a class="user-dropdown-item" th:href="@{/mypage}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.8-3.6 5-5.4 7.5-5.4s5.7 1.8 7.5 5.4"/></svg>
          회원정보
        </a>
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="user-dropdown-item logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            로그아웃
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- 공용 검색 도구: 띄어쓰기 AND 검색, 영문→한글 변환 제안 — topbar를 쓰는 모든 페이지에 자동 포함됩니다 -->
  <script th:src="@{/js/search-utils.js}"></script>
  <!-- 카테고리 전체보기 메가메뉴 스크립트 — topbar를 쓰는 모든 페이지에 자동 포함됩니다 -->
  <script th:src="@{/js/category-menu.js}"></script>
  <!-- 검색창 한영 오타 변환 제안 스크립트 — topbar를 쓰는 모든 페이지에 자동 포함됩니다 -->
  <script th:src="@{/js/topbar-search.js}"></script>
  <!-- 상품정보 수정 요청 팝업 스크립트 — topbar를 쓰는 모든 페이지에 자동 포함됩니다 -->
  <script th:src="@{/js/product-request.js}"></script>
  <!-- 상단 벨 아이콘 알림 스크립트 — topbar를 쓰는 모든 페이지에 자동 포함됩니다 -->
  <script th:src="@{/js/notification-bell.js}"></script>
  <!-- 채팅 아이콘/대화창 스크립트 — topbar를 쓰는 모든 페이지에 자동 포함됩니다 -->
  <script th:src="@{/js/chat-widget.js}"></script>
  <!-- G마켓용 엑셀 다운로드 (상품 상세창, 목록 화면의 버튼이 사용) -->
  <script th:src="@{/js/gmarket-export.js}"></script>
</div>

</body>
</html>
