<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
  공용 사이드바 프래그먼트입니다.
  사용하는 쪽에서 th:replace="~{fragments/sidebar :: sidebar(active='dashboard')}" 처럼
  현재 페이지가 어디인지(active)를 넘겨주면, 그 메뉴에 골드 라인이 표시됩니다.
  active로 쓸 수 있는 값: 'dashboard', 'members', 'categories'
-->
<aside class="sidebar" th:fragment="sidebar(active)">
  <div class="brand">
    <div class="brand-mark"><img th:src="@{/images/logo.png}" alt="WDC-HUB 로고"></div>
    <div>
      <div class="brand-name">WDC-HUB</div>
      <div class="brand-sub">WMULLYU DATA CENTER</div>
    </div>
  </div>

  <div class="nav-group">
    <a class="nav-item" th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/dashboard}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span>대시보드</span>
    </a>
  </div>

  <div class="nav-group" sec:authorize="hasRole('ADMIN')">
    <div class="nav-label">상품관리</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><span>상품관리</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.59 13.41L12 22l-9-9V4a1 1 0 0 1 1-1h9l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/></svg><span>브랜드관리</span></div>
    <a class="nav-item" th:classappend="${active == 'categories'} ? 'active'" th:href="@{/admin/categories}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>카테고리관리</span>
    </a>
  </div>

  <div class="nav-group" sec:authorize="hasRole('ADMIN')">
    <div class="nav-label">회원관리</div>
    <a class="nav-item" th:classappend="${active == 'members'} ? 'active'" th:href="@{/admin/members}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>회원관리</span>
      <span class="count" th:if="${pendingMemberCount != null and pendingMemberCount > 0}" th:text="${pendingMemberCount}">3</span>
    </a>
  </div>

  <div class="nav-group">
    <div class="nav-label">상품 데이터</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg><span>전체 상품</span><span class="count">4,182</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 11h18"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>번들상품</span><span class="count">612</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12h6l2-3h4l2 3h6"/><path d="M2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6"/><path d="M12 3v6"/></svg><span>수입상품</span><span class="count">958</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16"/></svg><span>일반상품</span><span class="count">2,612</span></div>
  </div>

  <div class="nav-group">
    <div class="nav-label">채널 · 연동</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18M3 12h18"/></svg><span>오픈마켓 연동</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 15l3-10h10l3 10"/><path d="M4 15h16v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3z"/><path d="M9 19v2M15 19v2"/></svg><span>쿠팡 로켓그로스</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span>쇼핑몰·홈페이지 제작</span></div>
  </div>

  <div class="nav-group">
    <div class="nav-label">도구</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h2M12 10h2M16 10h2M8 14h2M12 14h2M16 14h2M8 18h2M12 18h2"/></svg><span>판매가 계산기</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>캘린더</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21c-4-3-8-6-8-11a4 4 0 0 1 8-1.5A4 4 0 0 1 20 10c0 5-4 8-8 11z" opacity="0"/><path d="M4 20V6l3-4h10l3 4v14l-8-4-8 4z"/></svg><span>공지사항</span></div>
  </div>

  <div class="sidebar-foot">
    <div class="plan-card">
      <div class="p-tt">비즈니스 플랜</div>
      <div class="p-sub">상품 조회 12,400 / 20,000</div>
      <div class="progress" style="margin-top:8px;"><div style="width:62%;"></div></div>
    </div>
  </div>
</aside>

</body>
</html>
