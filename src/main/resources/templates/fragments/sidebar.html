<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
  공용 사이드바 프래그먼트입니다.
  사용하는 쪽에서 th:replace="~{fragments/sidebar :: sidebar(active='dashboard')}" 처럼
  현재 페이지가 어디인지(active)를 넘겨주면, 그 메뉴에 골드 라인이 표시됩니다.
  active로 쓸 수 있는 값: 'dashboard', 'members', 'categories', 'brands', 'products', 'notices', 'notice-board', 'product-request', 'product-modify-request', 'product-requests'
-->
<aside class="sidebar" th:fragment="sidebar(active)">
  <div class="brand">
    <div class="brand-mark"><img th:src="@{/images/logo.png}" alt="WDC-HUB 로고"></div>
    <div>
      <div class="brand-name">WDC-HUB</div>
      <div class="brand-sub">WMULLYU DATA CENTER</div>
    </div>
  </div>

  <div class="nav-group nav-group-pinned">
    <a class="nav-item nav-item-dashboard" th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/dashboard}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span>대시보드</span>
    </a>
  </div>

  <div class="sidebar-nav">
  <div class="nav-group" sec:authorize="hasRole('ADMIN')">
    <div class="nav-label">상품관리</div>
    <a class="nav-item" th:classappend="${active == 'products'} ? 'active'" th:href="@{/admin/products}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span>상품관리</span>
    </a>
    <a class="nav-item" th:classappend="${active == 'brands'} ? 'active'" th:href="@{/admin/brands}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.59 13.41L12 22l-9-9V4a1 1 0 0 1 1-1h9l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/></svg>
      <span>브랜드관리</span>
    </a>
    <a class="nav-item" th:classappend="${active == 'categories'} ? 'active'" th:href="@{/admin/categories}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>카테고리관리</span>
    </a>
    <a class="nav-item" th:classappend="${active == 'product-requests'} ? 'active'" th:href="@{/admin/product-requests}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg>
      <span>요청관리</span>
    </a>
  </div>

  <div class="nav-group" sec:authorize="hasRole('ADMIN')">
    <div class="nav-label">공지사항관리</div>
    <a class="nav-item" th:classappend="${active == 'notices'} ? 'active'" th:href="@{/admin/notices}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V6l3-4h10l3 4v14l-8-4-8 4z"/></svg>
      <span>공지사항관리</span>
    </a>
  </div>

  <div class="nav-group" sec:authorize="hasRole('ADMIN')">
    <div class="nav-label">회원관리</div>
    <a class="nav-item" th:classappend="${active == 'members'} ? 'active'" th:href="@{/admin/members}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>회원관리</span>
      <span class="count" th:if="${pendingMemberCount != null and pendingMemberCount > 0}" th:text="${pendingMemberCount}">3</span>
    </a>
  </div>

  <div class="nav-group">
    <div class="nav-label">상품 데이터</div>
    <a class="nav-item" th:href="@{/products(filter='all')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg><span>전체 상품</span><span class="count" th:text="${totalProductCount != null} ? ${totalProductCount} : '4,182'">4,182</span></a>
    <a class="nav-item" th:href="@{/products(filter='bundle')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 11h18"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>번들상품</span><span class="count" th:text="${bundleCount != null} ? ${bundleCount} : '612'">612</span></a>
    <a class="nav-item" th:href="@{/products(filter='import')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12h6l2-3h4l2 3h6"/><path d="M2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6"/><path d="M12 3v6"/></svg><span>수입상품</span><span class="count" th:text="${importedCount != null} ? ${importedCount} : '958'">958</span></a>
    <a class="nav-item" th:href="@{/products(filter='normal')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16"/></svg><span>일반상품</span><span class="count" th:text="${normalCount != null} ? ${normalCount} : '2,612'">2,612</span></a>
    <a class="nav-item" th:href="@{/products/by-brand}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.59 13.41L12 22l-9-9V4a1 1 0 0 1 1-1h9l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/></svg><span>브랜드별 상품</span></a>
    <a class="nav-item" th:href="@{/products/by-category}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>카테고리별 상품</span></a>
  </div>

  <div class="nav-group">
    <div class="nav-label">서비스</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 15l3-10h10l3 10"/><path d="M4 15h16v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3z"/><path d="M9 19v2M15 19v2"/></svg><span>쿠팡 로켓그로스</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span>쇼핑몰제작</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7"/><path d="M4 10v10a1 1 0 0 0 1 1h4v-6h6v6h4a1 1 0 0 0 1-1V10"/></svg><span>홈페이지제작</span></div>
  </div>

  <div class="nav-group">
    <div class="nav-label">도구</div>
    <!-- 상품등록 요청: 동작은 아직 정해지지 않아 안내만 띄웁니다.
         동작이 정해지면 href를 실제 주소(예: @{/product-requests})로 바꾸고 onclick을 지우세요. -->
    <a class="nav-item" th:classappend="${active == 'product-request'} ? 'active'" href="#" data-action="product-request"
       onclick="alert('상품등록 요청 기능은 준비 중이에요.'); return false;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></svg>
      <span>상품등록 요청</span>
    </a>
    <a class="nav-item" th:classappend="${active == 'product-modify-request'} ? 'active'" th:href="@{/product-requests}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      <span>상품정보수정 요청</span>
    </a>
    <a class="nav-item" th:classappend="${active == 'notice-board'} ? 'active'" th:href="@{/notices}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21c-4-3-8-6-8-11a4 4 0 0 1 8-1.5A4 4 0 0 1 20 10c0 5-4 8-8 11z" opacity="0"/><path d="M4 20V6l3-4h10l3 4v14l-8-4-8 4z"/></svg>
      <span>공지사항</span>
    </a>
  </div>
  </div>
</aside>

</body>
</html>
