<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WDC-HUB — 셀러 가입 신청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>

<div class="page">
  <div class="brand">
    <div class="brand-mark"><img th:src="@{/images/logo.png}" alt="WDC-HUB 로고"></div>
    <div>
      <div class="brand-name">WDC-HUB</div>
      <div class="brand-sub">WMULLYU DATA CENTER</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="eyebrow mono">SELLER SIGN UP</div>
      <h1>셀러 가입 신청</h1>
      <p>기본 정보와 사업자 정보를 입력해주세요. 검토 후 1~2일 내 승인 안내드립니다.</p>
    </div>

    <form id="signupForm" th:action="@{/signup}" th:object="${signupForm}" method="post" enctype="multipart/form-data">

      <ul class="global-error" th:if="${#fields.hasGlobalErrors()}">
        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
      </ul>

      <div class="section-title">계정 정보</div>
      <div class="grid2">
        <div class="field">
          <label>아이디<span class="req">*</span></label>
          <div class="field-with-btn">
            <div class="field-input"><input type="text" th:field="*{loginId}" placeholder="영문, 숫자 4~20자"></div>
            <button type="button" class="btn-inline">중복확인</button>
          </div>
          <div class="field-error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></div>
        </div>
        <div class="field">
          <label>담당자 이름<span class="req">*</span></label>
          <div class="field-input"><input type="text" th:field="*{name}" placeholder="이름을 입력하세요"></div>
          <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="field">
          <label>비밀번호<span class="req">*</span></label>
          <div class="field-input"><input type="password" th:field="*{password}" placeholder="영문, 숫자, 특수문자 조합 8자 이상"></div>
          <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="field">
          <label>비밀번호 확인<span class="req">*</span></label>
          <div class="field-input"><input type="password" th:field="*{passwordConfirm}" placeholder="비밀번호를 다시 입력하세요"></div>
          <div class="field-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></div>
        </div>

        <!-- 이메일: 형식 검증 힌트 추가 -->
        <div class="field full">
          <label>이메일<span class="req">*</span></label>
          <div class="field-with-btn">
            <div class="field-input"><input type="email" id="email" th:field="*{email}" placeholder="example@company.co.kr"></div>
            <button type="button" class="btn-inline">인증번호 받기</button>
          </div>
          <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
          <div class="hint" id="emailFormatHint"></div>
          <div class="hint">인증번호 받기 기능은 준비 중이며, 곧 연결될 예정이에요.</div>
        </div>

        <!-- 휴대폰 번호: 3분할 숫자 입력 -->
        <div class="field full">
          <label>휴대폰 번호<span class="req">*</span></label>
          <div class="field-with-btn">
            <div class="segmented" data-hidden="phoneNumberHidden">
              <input type="text" class="seg-input" inputmode="numeric" maxlength="3" placeholder="010">
              <span class="seg-sep">-</span>
              <input type="text" class="seg-input" inputmode="numeric" maxlength="4" placeholder="1234">
              <span class="seg-sep">-</span>
              <input type="text" class="seg-input" inputmode="numeric" maxlength="4" placeholder="5678">
            </div>
            <button type="button" class="btn-inline">인증번호 받기</button>
          </div>
          <input type="hidden" id="phoneNumberHidden" th:field="*{phoneNumber}">
          <div class="field-error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
          <div class="hint">인증번호 받기 기능은 준비 중이며, 곧 연결될 예정이에요.</div>
        </div>
      </div>

      <div class="section-title">사업자 정보</div>
      <div class="grid2">
        <div class="field">
          <label>상호명<span class="req">*</span></label>
          <div class="field-input"><input type="text" th:field="*{companyName}" placeholder="회사명을 입력하세요"></div>
          <div class="field-error" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
        </div>
        <div class="field">
          <label>대표자명<span class="req">*</span></label>
          <div class="field-input"><input type="text" th:field="*{ceoName}" placeholder="대표자 성함"></div>
          <div class="field-error" th:if="${#fields.hasErrors('ceoName')}" th:errors="*{ceoName}"></div>
        </div>

        <!-- 사업자등록번호: 3분할 숫자 입력 (3-2-5) -->
        <div class="field full">
          <label>사업자등록번호<span class="req">*</span></label>
          <div class="segmented" data-hidden="bizNumHidden" style="max-width:280px;">
            <input type="text" class="seg-input" inputmode="numeric" maxlength="3" placeholder="123">
            <span class="seg-sep">-</span>
            <input type="text" class="seg-input" inputmode="numeric" maxlength="2" placeholder="45">
            <span class="seg-sep">-</span>
            <input type="text" class="seg-input" inputmode="numeric" maxlength="5" placeholder="67890">
          </div>
          <input type="hidden" id="bizNumHidden" th:field="*{businessRegistrationNumber}">
          <div class="field-error" th:if="${#fields.hasErrors('businessRegistrationNumber')}" th:errors="*{businessRegistrationNumber}"></div>
        </div>

        <div class="field">
          <label>업태<span class="opt">(선택)</span></label>
          <div class="field-input"><input type="text" th:field="*{businessType}" placeholder="예: 도소매"></div>
        </div>
        <div class="field">
          <label>종목<span class="opt">(선택)</span></label>
          <div class="field-input"><input type="text" th:field="*{businessCategory}" placeholder="예: 전자상거래"></div>
        </div>

        <!-- 사업장 주소: 우편번호 + 주소찾기 버튼 + 주소 + 상세주소 -->
        <div class="field full">
          <label>사업장 주소<span class="opt">(선택)</span></label>
          <div class="field-with-btn">
            <div class="field-input" style="max-width:160px;">
              <input type="text" id="zonecode" th:field="*{zonecode}" placeholder="우편번호" readonly>
            </div>
            <button type="button" id="btnFindAddress" class="btn-inline">주소찾기</button>
          </div>
          <div class="addr-block">
            <div class="field-input">
              <input type="text" id="companyAddress" th:field="*{companyAddress}" placeholder="주소찾기를 눌러 주소를 검색하세요" readonly>
            </div>
            <div class="field-input">
              <input type="text" id="addressDetail" th:field="*{addressDetail}" placeholder="상세주소를 입력하세요 (동/호수 등)">
            </div>
          </div>
        </div>

        <!-- 회사 대표번호: 3분할 숫자 입력 -->
        <div class="field full">
          <label>회사 대표번호<span class="opt">(선택)</span></label>
          <div class="segmented" data-hidden="companyPhoneHidden" style="max-width:280px;">
            <input type="text" class="seg-input" inputmode="numeric" maxlength="3" placeholder="02">
            <span class="seg-sep">-</span>
            <input type="text" class="seg-input" inputmode="numeric" maxlength="4" placeholder="1234">
            <span class="seg-sep">-</span>
            <input type="text" class="seg-input" inputmode="numeric" maxlength="4" placeholder="5678">
          </div>
          <input type="hidden" id="companyPhoneHidden" th:field="*{companyPhone}">
        </div>

        <!-- 팩스번호: 3분할 숫자 입력 -->
        <div class="field full">
          <label>팩스번호<span class="opt">(선택)</span></label>
          <div class="segmented" data-hidden="companyFaxHidden" style="max-width:280px;">
            <input type="text" class="seg-input" inputmode="numeric" maxlength="3" placeholder="02">
            <span class="seg-sep">-</span>
            <input type="text" class="seg-input" inputmode="numeric" maxlength="4" placeholder="1234">
            <span class="seg-sep">-</span>
            <input type="text" class="seg-input" inputmode="numeric" maxlength="4" placeholder="5678">
          </div>
          <input type="hidden" id="companyFaxHidden" th:field="*{companyFax}">
        </div>

        <!-- 사업자등록증 파일 업로드 -->
        <div class="field full">
          <label>사업자등록증<span class="req">*</span></label>
          <div class="file-upload">
            <label for="businessLicenseFile" class="file-upload-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
              파일 선택
            </label>
            <span class="file-upload-name" id="fileUploadName">선택된 파일이 없습니다</span>
            <input type="file" id="businessLicenseFile" name="businessLicenseFile"
                   accept=".jpg,.jpeg,.png,.pdf" class="file-upload-input" required>
          </div>
          <div class="field-error" th:if="${#fields.hasErrors('businessLicenseFile')}" th:errors="*{businessLicenseFile}"></div>
          <div class="hint">JPG, PNG, PDF 파일만 업로드할 수 있어요. (10MB 이하)</div>
          <div class="hint" id="fileUploadHint"></div>
        </div>
      </div>

      <label class="terms">
        <input type="checkbox" th:field="*{agreeTerms}">
        <span><a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의합니다. 입력하신 정보는 가입 심사 목적으로만 사용됩니다.</span>
      </label>

      <div class="upload-progress-wrap" id="signupProgressWrap" style="display:none;">
        <div class="upload-progress-track"><div class="upload-progress-bar" id="signupProgressBar"></div></div>
        <div class="upload-progress-label" id="signupProgressLabel">가입 신청 처리 중... 0%</div>
      </div>

      <button type="submit" class="btn-submit" id="signupSubmitBtn">
        가입 신청하기
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="card-foot">이미 계정이 있으신가요? <a th:href="@{/login}">로그인하기</a></div>
  </div>
</div>

<!-- 카카오 우편번호 서비스 -->
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script th:src="@{/js/signup.js}"></script>
</body>
</html>
