<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WDC-HUB — 브랜드관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/dashboard.css}">
<link rel="stylesheet" th:href="@{/css/brands.css}">
<style>
  /* 대시보드 "주요 브랜드" 선택 패널 */
  .featured-order-list{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px; }
  .featured-order-empty{ font-size:12.5px; color:var(--text-faint); }
  .featured-chip{
    display:flex; align-items:center; gap:8px; padding:6px 10px 6px 8px; border-radius:20px;
    background:var(--bg-raise); border:1px solid var(--line); font-size:12.5px;
  }
  .featured-chip .num{
    display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%;
    background:var(--gold); color:#1a1400; font-weight:700; font-size:10.5px; flex-shrink:0;
  }
  .featured-chip .logo{ width:18px; height:18px; border-radius:4px; object-fit:contain; background:#fff; flex-shrink:0; }
  .featured-chip .x{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:14px; line-height:1; padding:0 0 0 2px; }
  .featured-chip .x:hover{ color:var(--red); }
  .brand-featured-check{ width:16px; height:16px; accent-color:var(--gold); cursor:pointer; }
  .brand-featured-check:disabled{ cursor:not-allowed; opacity:.4; }
  .featured-save-msg{ margin-top:10px; font-size:12.5px; min-height:1.2em; }
  .featured-save-msg.ok{ color:var(--green); }
  .featured-save-msg.err{ color:var(--red); }

  /* 로고 업로드 */
  .logo-upload-row{ display:flex; align-items:center; gap:14px; }
  .logo-preview{
    width:64px; height:64px; border-radius:8px; border:1px solid var(--line); background:var(--bg-raise);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;
  }
  .logo-preview img{ width:100%; height:100%; object-fit:contain; }
  .logo-preview-empty{ font-size:10.5px; color:var(--text-faint); text-align:center; }
  .logo-upload-actions{ display:flex; gap:8px; align-items:center; }
  .logo-upload-actions .btn{ cursor:pointer; }
  .brand-logo-cell{ width:34px; height:34px; border-radius:6px; object-fit:contain; background:#fff; border:1px solid var(--line); }
</style>
</head>
<!-- data-api-base: 브랜드 JSON API 기본 경로. data-category1-api: 1차 카테고리 목록(드롭다운용) -->
<body th:attr="data-api-base=@{/admin/brands}, data-category1-api=@{/admin/categories/category1}">

<div class="ticker">
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<div class="shell">
  <aside th:replace="~{fragments/sidebar :: sidebar(active='brands')}"></aside>

  <!-- MAIN -->
  <div class="main">
    <div th:replace="~{fragments/topbar :: topbar(
          searchPlaceholder='브랜드명, 제조사, 수입사로 검색',
          showKbdHint=false,
          showCategoryBtn=false,
          avatarText=${avatarText},
          companyName=${companyName},
          showExport=false,
          showCalcBtn=false,
          showBell=false,
          searchNavUrl=null)}"></div>

    <div class="content">
      <div class="page-head">
        <div class="page-title">브랜드관리<span>브랜드명을 클릭하면 아래에서 수정할 수 있어요</span></div>
      </div>

      <!-- 대시보드 "주요 브랜드" 선택 -->
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">대시보드 주요 브랜드<span class="n" id="featuredCount">0/10</span></div>
          <div class="panel-action">
            <button type="button" id="btnSaveFeatured" class="btn gold" disabled>선택 저장</button>
          </div>
        </div>
        <div class="panel-body">
          <p class="hint-text" style="margin:0 0 10px;">아래 목록에서 브랜드 이름 왼쪽 체크박스를 순서대로 눌러 최대 10개까지 고르세요. 고른 순서 그대로 대시보드에 1위부터 노출돼요. 로고가 없는 브랜드는 대시보드에서 이름만 보여요.</p>
          <ol class="featured-order-list" id="featuredOrderList"><li class="featured-order-empty">아직 고른 브랜드가 없어요.</li></ol>
          <div class="featured-save-msg" id="featuredSaveMsg" role="status" aria-live="polite"></div>
        </div>
      </div>

      <!-- 목록 + 페이징 -->
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">전체 브랜드<span class="n" id="brandCount">0건</span></div>
          <div class="panel-action">
            <button type="button" id="btnAddBrand" class="btn gold">+ 브랜드 등록</button>
          </div>
        </div>
        <div class="table-fixed-height" style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th style="width:40px;"><span class="visually-hidden">주요 브랜드</span>★</th>
                <th>코드</th>
                <th>브랜드명</th>
                <th>제조사</th>
                <th>수입사</th>
                <th>취급상품</th>
                <th>원산지</th>
                <th>수입구분</th>
                <th>카테고리</th>
                <th>정렬</th>
                <th>사용</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="brandTableBody">
              <tr class="empty-row"><td colspan="11">불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="brandPagination"></div>
      </div>

      <!-- 등록/수정 폼 -->
      <div class="panel" id="brandFormPanel" style="display:none;">
        <div class="panel-head">
          <div class="panel-title" id="brandFormTitle">브랜드 등록</div>
          <div class="panel-action">
            <button type="button" id="btnCloseForm" class="btn">닫기</button>
          </div>
        </div>
        <div class="panel-body">
          <form id="brandForm">
            <input type="hidden" id="brandId">

            <div class="calc-row">
              <div class="calc-field">
                <label>브랜드명(국문)<span class="req">*</span></label>
                <div class="field-with-match-btn">
                  <input type="text" id="brandNameKr" class="calc-input" required>
                  <button type="button" class="btn-match" id="brandNameUseBtn" title="이 이름을 사용하도록 확정합니다">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6 9 17l-5-5"/></svg>
                    사용
                  </button>
                </div>
                <div class="match-result" id="brandNameDupWarning"></div>
              </div>
              <div class="calc-field">
                <label>브랜드명(영문)</label>
                <input type="text" id="brandNameEn" class="calc-input">
              </div>
            </div>

            <div class="calc-row">
              <div class="calc-field">
                <label>제조사명<span class="req">*</span></label>
                <input type="text" id="manufacturerName" class="calc-input" required>
              </div>
              <div class="calc-field">
                <label>수입사명</label>
                <input type="text" id="importerName" class="calc-input">
              </div>
            </div>

            <div class="calc-field">
              <label>취급상품 요약</label>
              <textarea id="productSummary" class="calc-input" rows="2" maxlength="500"></textarea>
            </div>

            <div class="calc-row">
              <div class="calc-field">
                <label>원산지 / 제조국</label>
                <input type="text" id="countryOfOrigin" class="calc-input" placeholder="예: 대한민국, 프랑스">
              </div>
              <div class="calc-field">
                <label>수입구분</label>
                <select id="importType" class="calc-input">
                  <option value="">선택 안함</option>
                  <option value="OFFICIAL">정식수입</option>
                  <option value="PARALLEL">병행수입</option>
                  <option value="DIRECT_MANUFACTURE">직접제조</option>
                </select>
              </div>
            </div>

            <div class="calc-field">
              <label>주로 취급하는 1차 카테고리</label>
              <select id="brandCategory1" class="calc-input">
                <option value="">선택 안함</option>
              </select>
            </div>

            <!-- 로고는 브랜드를 먼저 등록해야 올릴 수 있어서 수정 화면에서만 보여요 -->
            <div class="calc-field" id="logoField" style="display:none;">
              <label>로고 이미지</label>
              <div class="logo-upload-row">
                <div class="logo-preview" id="logoPreview"><span class="logo-preview-empty">로고 없음</span></div>
                <div class="logo-upload-actions">
                  <label class="btn btn-sm" for="logoFileInput">이미지 선택</label>
                  <input type="file" id="logoFileInput" accept=".jpg,.jpeg,.png,.webp" class="visually-hidden">
                  <button type="button" class="btn btn-sm" id="btnRemoveLogo" style="display:none;">로고 삭제</button>
                </div>
              </div>
              <div class="hint-text" id="logoHint">JPG, PNG, WEBP · 5MB 이하</div>
            </div>

            <!-- 정렬순서/사용여부는 등록 시에는 자동 배정되어 수정할 때만 노출됩니다 -->
            <div class="calc-row" id="editOnlyFields" style="display:none;">
              <div class="calc-field">
                <label>정렬순서</label>
                <input type="number" id="sortOrder" class="calc-input">
              </div>
              <div class="calc-field">
                <label>사용여부</label>
                <label class="use-yn-toggle">
                  <input type="checkbox" id="useYn" checked>
                  <span>사용함</span>
                </label>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn gold" id="btnSaveBrand">저장</button>
            </div>
          </form>
        </div>
      </div>

      <!-- footer -->
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
  </div>
</div>

<script th:src="@{/js/ticker.js}"></script>
<script th:src="@{/js/brands.js}"></script>
</body>
</html>
